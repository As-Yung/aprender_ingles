# Configuración de Supabase CLI. Los valores de [auth] se aplican al entorno LOCAL
# (supabase start). En el proyecto en la nube configúralos en el panel (ver docs/CONFIGURACION.md)
# o con "supabase config push".
project_id = "aprender-ingles"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Nadie puede registrarse por su cuenta: solo el administrador crea usuarios.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = false
enable_confirmations = false
secure_password_change = true

[auth.mfa]
max_enrolled_factors = 3

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[functions.admin-users]
enabled = true
# La función verifica el JWT internamente (compatible con las nuevas claves de firma asimétricas).
verify_jwt = false
