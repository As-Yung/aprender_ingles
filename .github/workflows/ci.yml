name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: evita que paquetes comprometidos ejecuten código al instalarse
      - run: npm ci --ignore-scripts
      - name: Verificar firmas y procedencia de paquetes npm
        run: npm audit signatures
      - name: Auditoría de vulnerabilidades (altas y críticas)
        run: npm audit --audit-level=high --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

  dependency-review:
    # Requiere Dependency graph / Advanced Security (gratis en repos públicos)
    if: github.event_name == 'pull_request' && !github.event.repository.private
    # No bloquea el PR si "Dependency graph" aún no está activado en Settings → Advanced Security.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
