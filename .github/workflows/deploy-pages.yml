name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # La primera generación de audios tarda ~30 min; después se reutilizan desde la caché.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      # ---- Voz natural: audios pregenerados con Kokoro (voz neuronal libre, Apache 2.0) ----
      - name: Reunir las frases que la app pronuncia
        run: node scripts/collect-speech.mjs build/speech.json
      - name: Caché del modelo de voz
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/kokoro
          key: kokoro-model-v1.0-int8
      - name: Caché de audios ya generados
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: public/audio
          key: audio-kokoro-v1-${{ hashFiles('build/speech.json', 'scripts/generate-audio.py') }}
          restore-keys: audio-kokoro-v1-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/audio-requirements.txt
      - name: Generar audios (Kokoro)
        # Si falla, la web se publica igual y usa la voz del navegador.
        continue-on-error: true
        run: |
          pip install -r scripts/audio-requirements.txt
          mkdir -p build/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.int8.onnx voices-v1.0.bin; do
            [ -f "build/kokoro/$f" ] || curl -fsSL -o "build/kokoro/$f" "$base/$f"
          done
          sha256sum -c - <<'SUMS'
          6e742170d309016e5891a994e1ce1559c702a2ccd0075e67ef7157974f6406cb  build/kokoro/kokoro-v1.0.int8.onnx
          bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  build/kokoro/voices-v1.0.bin
          SUMS
          python scripts/generate-audio.py build/speech.json public/audio --model build/kokoro
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Valores PÚBLICOS (Settings → Secrets and variables → Actions → Variables)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_USERNAME_EMAIL_DOMAIN: ${{ vars.VITE_USERNAME_EMAIL_DOMAIN || 'usuarios.aprender-ingles.app' }}
      - name: Preparar sitio estático
        run: touch dist/.nojekyll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 3

  # Publica en la rama gh-pages (Settings → Pages → Source: Deploy from a branch → gh-pages / root).
  # Los pushes hechos con GITHUB_TOKEN sí disparan la publicación de GitHub Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: site
      - name: Publicar en gh-pages
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Despliegue ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
